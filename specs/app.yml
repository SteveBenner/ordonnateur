schema_version: 1
name: ordonnateur
version: 0.2.12
kind: plugin
purpose: >
  Gives each Claude Code event an ordered card of hooks that ordonnateur runs one after another from a single
  dispatcher hook, and lists, lints, times and test-fires the hooks of Claude Code, Codex, Hermes and Antigravity.
  Codex is read-only. Hermes hooks are reordered in place in its config.yaml, through plans, and its allowlist is never
  written. Antigravity hooks are ordered inside one hook spec of the global or workspace hooks.json, or gathered into
  a hook spec named ordonnateur, through plans; plugin files are never written. Blocking guard hooks are never
  sequenced. `ordonnateur web` shows the same hooks as a layout of events and sources in a browser and changes Claude
  Code, Hermes and Antigravity hook order only through plans.
commands: [list, lint, card, order, move, release, unguard, guard, fire, timings, watch, run, record, web, version]
contracts:
  card: specs/card.yml
  web: specs/web.yml
  environments: specs/polispec/environments.yml
release: >
  main is development, test checks a tagged release in its own checkout, and stable is production: only the operator
  promotes to stable, and its deploy pins the tag on the host and publishes the tag's export-ignore-filtered tree to
  the GitHub remote named in the manifest as one commit and tag. The release script never depends on the caller's
  PATH for the installed command or agy, because the operator launcher runs deploy steps with PATH=/usr/bin:/bin: it
  reads the installed command at rplugin's install link and finds agy on PATH, then in ~/.local/bin.
