schema_version: 1
name: ordonnateur
version: 0.4.1
kind: plugin
purpose: >
  Gives each Claude Code event an ordered card of hooks that ordonnateur runs one after another from a single
  dispatcher hook, and lists, lints, times and test-fires the hooks of Claude Code, Codex, Hermes and Antigravity.
  Codex is read-only. Hermes hooks are reordered in place in its config.yaml, through plans, and its allowlist is never
  written. Antigravity hooks are ordered inside one hook spec of the global or workspace hooks.json, or gathered into
  a hook spec named ordonnateur, through plans; plugin files are never written. Blocking guard hooks are never
  sequenced. `ordonnateur web` shows the same hooks as a layout of events and sources in a browser and changes Claude
  Code, Hermes and Antigravity hook order only through plans, and runs `untangle` and `plan` and changes their settings
  for the person at the browser. `ordonnateur untangle` judges hook health across eight
  dimensions and can heal a fixed set of flaws. `ordonnateur plan` interviews the user briefly, reads the whole agent
  setup and offers changes that serve the stated goals, applying only allowlisted Claude Code settings through plans.
  A model explains, ranks and proposes for both verbs; deterministic code gathers the facts and performs every write.
  `ordonnateur web` also opens a hook's script and provenance in a modal with download and open-in-desktop, and, only
  when web.hook_edit is on, edits a hook's script text or deletes a hook, each through a plan and a three-second
  press-and-hold. `ordonnateur hook` does the same from the command line for a person or an agent, and
  `ordonnateur provenance` reports when each hook was first seen, changed, enabled, disabled and removed, from a
  provenance port whose plugin-local store is the default and whose rdb binding is an extension.
commands: [list, lint, card, order, move, release, unguard, guard, fire, timings, watch, untangle, plan, run, record, web, hook, provenance, version]
safety:
  hook_edit: "Editing a hook's script text and deleting a hook are off until web.hook_edit is true; the browser cannot turn it on. Codex hooks, plugin hooks and hooks a policy engine pins are never edited or deleted. A script a pinned hook runs is never edited. Every edit or delete is a plan with its diff and policy verdict, and the browser applies one only after a server-timed three-second hold."
  provenance: "Provenance records what ordonnateur observed and did, labeled by how it knows. It never claims an install time it did not see: a first sighting says first seen, not installed. The hot path never loads it."
  terminal_output: "Text the command line prints and watch notifications replace control characters other than newline and tab. JSON output escapes them instead."
  previews: "Building a plan runs no program a repository configures. The Antigravity tracked-file check turns git's filesystem monitor off."
contracts:
  card: specs/card.yml
  web: specs/web.yml
  untangle_plan: specs/untangle-plan.yml
  environments: specs/polispec/environments.yml
antigravity_install: >
  ordonnateur is not installed into Antigravity (compatibility antigravity: unsupported, since 0.2.13): Antigravity
  installs a plugin from its root plugin.json, Codex prefers that file over .codex-plugin/plugin.json and reads no hooks
  from it, and rplugin 1.19.5 renders it only for a plugin with no Codex hooks or a claimed harness that needs it, so
  claiming Antigravity silenced the Codex session-start watch hook. list, lint, fire, watch, order, move and release
  still read and order Antigravity's hooks.
