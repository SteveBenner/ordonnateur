schema_version: 1
name: ordonnateur.card
version: 1
kind: contract
purpose: >
  A card is the ordered list of hooks ordonnateur runs itself, one after
  another, for each carded event of one Claude Code scope. The scope's
  settings file holds one dispatcher entry per carded event in place of the
  members. The card is a YAML file; ordonnateur writes it, and members may be
  reordered by hand.
files:
  user: "${CLAUDE_CONFIG_DIR:-~/.claude}/ordonnateur.yml"
  local: "${XDG_STATE_HOME:-~/.local/state}/rplugin/ordonnateur/cards/<first 16 hex of sha256 of the absolute project root>.local.yml"
  local_reason: A local card never lands inside a repository.
fields:
  schema: { type: string, value: ordonnateur.card/v1 }
  harness: { type: string, value: claude-code }
  scope: { type: string, values: [user, local], meaning: "The settings file the dispatcher entries live in." }
  settings_file: { type: string, meaning: "Absolute path of that settings file." }
  unguarded: { type: "list<string>", meaning: "Digests of guard-event hooks the user allowed to be sequenced." }
  events:
    type: "map<Event, event>"
    event:
      stop_on_block: { type: bool, meaning: "A member that blocks ends the sequence; later members are recorded as skipped." }
      members:
        type: "list<member>"
        member:
          id: { type: string, meaning: "cc:<scope>:<Event>:<8 hex of the digest>." }
          matcher: { type: "string|null", meaning: "The matcher the hook had in its group." }
          hook: { type: object, meaning: "The hook object exactly as it was in the settings file." }
          digest: { type: string, meaning: "sha256:<hex of canonical JSON of {matcher, hook}>." }
          absorbed_at: { type: string, meaning: "UTC ISO 8601 time the hook became a member." }
canonical_json: "JSON.generate of the value with object keys sorted recursively."
rules:
  - "Members run in list order. A member's digest is checked before its matcher. A member whose matcher does not match the payload is skipped without being shown."
  - "A member whose digest no longer matches its matcher and hook is not run and lint reports ORD-CARD-DIGEST. On a guard event (PreToolUse, UserPromptSubmit, PreCompact) that member counts as a block with exit 2 and the reason, as does a card that cannot be read, an event with no entry, a payload that is not a JSON object or any other failure while dispatching; on any other event they are reported with exit 1."
  - "A member with no args runs under /bin/sh, as Claude Code does on Linux and macOS, or under bash when its shell field is bash; a missing bash is a spawn error. A member with args runs without a shell."
  - "A member that exits nonzero other than 2 keeps its valid JSON, as Claude Code does. After a timeout, JSON that blocks or denies still counts and any other JSON is dropped, so a timed-out hook can block but cannot allow, rewrite input or add context. Plain stdout counts only on exit 0."
  - "A hook with an if field is not sequenceable, because the dispatcher cannot evaluate permission rule syntax. A member already on a card is unchanged."
  - "On a guard event, a member that exits 0 with stdout that starts with an opening brace but does not parse, including stdout cut at the 1 MiB cap, counts as a block with exit 2 and the reason. This is stricter than Claude Code, which treats invalid JSON as a non-blocking error."
  - "ordonnateur writes a card with mode 0600 every time, whatever mode the file had."
  - "A hook is a dispatcher only when its command is exactly six shell words: a program path ending in /ordonnateur, run, claude-code, the event, --card and the card path."
  - "The dispatcher entry for an event exists exactly while the event has members."
