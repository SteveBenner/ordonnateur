schema_version: 1
name: ordonnateur.web
version: 1
kind: contract
purpose: >
  `ordonnateur web` serves a local web app that shows every Claude Code,
  Codex, Hermes and Antigravity hook as a layout of events and sources, and changes Claude
  Code hook order, Hermes hook order and Antigravity hook order only through plans: a draft becomes a plan with its diff, the policy
  verdict for every file it writes and the lint findings before and after;
  an apply recomputes the plan and writes only when nothing moved since. The
  app has no database: it reads the files ordonnateur already reads and writes
  through the same Takeover, HermesOrder and AntigravityOrder code as the command line. Codex stays read-only.
  It also runs `untangle` and `plan` for the person at the browser and changes the four settings those verbs read,
  through the same Untangle, SetupPlan and settings code as the command line, under the rules of
  specs/untangle-plan.yml. It shows a hook's script and provenance in a modal and, only while web.hook_edit is on,
  edits a script's text or deletes a hook through plans applied after a three-second hold. The app ships in the
  plugin; hosting under a supervisor is the host's business, never the plugin's.

command:
  usage:
    - "ordonnateur web [--bind ADDR] [--port N] [--public-origin URL] [--expose] [--open] [--read-only] [--json]"
    - "ordonnateur web url [--json]"
  flags:
    bind: "Overrides web.bind. An address that is not loopback needs --expose."
    port: "Overrides web.port. 0 asks the system for a free port; the chosen port is printed."
    public_origin: "Overrides web.public_origin."
    expose: "Allows a non-loopback bind. Needs a terminal and the typed phrase `expose ordonnateur web`; without --expose such a bind exits 2 expose_required, without a terminal exits 2 not_tty."
    open: "Hands the link to xdg-open or open when one is on PATH, otherwise prints a note."
    read_only: "Every write route answers 405 read_only and /config says so."
    json: "Prints one line {url, bind, port, pid, read_only} instead of the text lines."
  ready_text:
    - "ordonnateur web: serving <bind>:<port>; stop with Ctrl-C"
    - "open this link within 120 seconds, it works once:"
    - "<origin>/#k=<one-time code>"
  url_subcommand: "Prints a fresh one-time link for the running server, signed with the launch secret, without contacting the server. Exit 2 not_running when no live server.json exists."
  single_instance: "One server per state home. A server holds an exclusive lock on <state>/web/server.lock (mode 0600) from before it reads the launch secret until it exits. A start that cannot take the lock exits 2 already_running. <state>/web/server.json holds pid, port, bind, public_origin and started_at; a start also exits 2 already_running when that record names a live pid, and a record whose pid is dead is renamed aside with a UTC stamp."
  shutdown: "SIGINT and SIGTERM stop the server; the exit removes server.json when it is ours."
  exit_codes: { 0: stopped cleanly, 2: "usage, refused (disabled, expose_required, not_tty, already_running, port_in_use, bind_failed, not_running, secret_empty)" }
  dependencies: "Ruby standard library plus the WEBrick copy in vendor/webrick, loaded only by `ordonnateur web`. `ordonnateur run` and `ordonnateur record` never load it."
  state_dir: "<state> is ${XDG_STATE_HOME:-~/.local/state}/rplugin/ordonnateur. <state>/web is mode 0700."

settings:
  - { key: web.enabled, type: bool, default: true, kill_switch: ORDONNATEUR_WEB_DISABLED, meaning: "false refuses `ordonnateur web` with exit 2 disabled, and a running server answers every apply 403 disabled (read at each apply)." }
  - { key: web.bind, type: string, default: 127.0.0.1 }
  - { key: web.port, type: int, default: 7422, min: 0, max: 65535 }
  - { key: web.public_origin, type: string, default: "", meaning: "One exact HTTPS origin for a reverse proxy (scheme https, a host, an optional port; no credentials, path, query or fragment, else startup exits 2). Links use it, and the Host and Origin checks admit it." }
  - { key: web.theme, type: enum, options: [system, apple-noir, apple-austere, tronwave, minimal-dark, minimal-light], default: system, meaning: "Theme on a first visit; system follows the browser's light or dark preference. The viewer's own choice, kept in the browser, wins." }
  - { key: web.projects, type: string, default: "", meaning: "Colon-separated absolute project roots whose local scope is always listed." }
  - { key: web.discover, type: bool, default: true, meaning: "Lists projects Claude Code knows: only the keys of the projects object in the Claude Code state file are read." }
  - { key: web.hook_edit, type: bool, default: false, kill_switch: ORDONNATEUR_HOOK_EDIT_DISABLED, meaning: "true lets the app edit a hook's script text and delete a hook, each through a plan and a hold. Read at each request. Not in the four keys the browser may change." }
  - { key: provenance.enabled, type: bool, default: true, kill_switch: ORDONNATEUR_PROVENANCE_DISABLED, meaning: "false stops recording and reading provenance; the modal's provenance tab says so." }
  - { key: provenance.backend, type: enum, options: [local, extension], default: local, env: ORDONNATEUR_PROVENANCE_BACKEND, meaning: "Where provenance is kept: local is a file under the state home, extension is the provenance port's extension adapter (rdb on rStack hosts). The environment variable wins over the setting. With extension and no adapter or an unreachable store, events spool to the local file and the store is reported degraded; they replay when it answers." }

session:
  launch_secret: "<state>/web/launch.secret, 32 random bytes as hex, mode 0600, kept across restarts. It is written and synced to a private temporary file and hard-linked into place, so the path only ever holds a complete secret and the first of several simultaneous starts wins. A secret file that is empty after stripping whitespace stops startup with exit 2 secret_empty and is left untouched; the operator deletes it to create a new one."
  one_time_code: "nonce.expiry.mac, mac = first 32 hex of HMAC-SHA256(secret, nonce + '.' + expiry); valid 120 seconds, usable once (seen nonces remembered until expiry). It travels in the URL fragment #k=."
  exchange: "POST /api/v1/session {code} answers 200 {token, expires_at}. No response sets a cookie and no request reads one. A used, expired or forged code answers 401 unauthorized."
  limits: "At most 64 sessions, least recently used dropped beyond. A session expires after 12 hours without a request. GET /api/v1/session returns expires_at and never the token; DELETE ends it."
  bearer: "Every route except POST /api/v1/session and static files needs Authorization: Bearer <token>, 64 hex characters. The page keeps the token in sessionStorage under ordonnateur.web.session, so a sibling service on the same hostname never receives it, even on another port, a reload keeps the session, a new tab needs a new link, and each link opens its own session, so signing out ends that tab's session and leaves others running until they expire. Browsers never attach it to a request by themselves, so no CSRF token is needed. When the page cannot store the token it keeps it in memory and shows an error toast once the app opens, because a reload then ends the session; when it cannot clear the token at sign-out, the session_ended gate says to close the tab."
  origin: "Every such request carries an Origin naming this server (http://127.0.0.1:<port>, http://localhost:<port> or the bind address), else 403. When web.public_origin is set, only that exact origin passes. POST /session accepts a missing Origin and refuses a foreign one."
  host: "Every request, static files included, carries a Host naming this server and port (or the public origin's host and effective port), else 403. This blocks DNS rebinding."
  unauthenticated: "Every route except POST /api/v1/session and static files answers 401 without a valid bearer token."

http:
  body_limit: "Request bodies above 1 MiB answer 413. On every route, static files included, a request with a Transfer-Encoding header (a chunked body) answers 411 before any other check, and the connection closes without the body or its trailers being read."
  request_id: "Every response carries X-Request-Id (16 hex)."
  error_shape: "{error, message, request_id} plus fields named per error."
  caching: "API responses are Cache-Control: no-store. Static files carry an ETag and Cache-Control: no-cache."
  headers: "Content-Security-Policy: default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'. X-Content-Type-Options: nosniff. Referrer-Policy: no-referrer."
  static_root: "web/public. A path that resolves outside it is never served: WEBrick answers a traversal path such as /../ or %2e%2e with 400, any other missing file with 404."
  timeouts: "WEBrick RequestTimeout 30 seconds. The policy port keeps its own 20-second limit per judgment."
  log: "<state>/web/server.log, access and error lines, mode 0600, rotated once to server.log.1 at 4 MiB."

limiter:
  rule: "Each session may make 30 changes in any 60 seconds; the 31st answers 429 rate_limited with Retry-After in seconds. A change is any request that is not GET or HEAD and passes the read-only and Origin checks, accepted or not. POST /api/v1/session is outside the limiter."
  apply_lock: "One apply runs at a time in the process; a second waits for the first."

routes:
  "GET /api/v1/config":
    answers: "{version, theme, read_only, enabled, policy_source: polispec|standalone, folder_picker: {source: standalone|rui-hub, component: null|{module, script, selectable}}, discover, events: {claude-code: [lifecycle order], codex: [lifecycle order], hermes: [Model::HERMES_EVENTS order], antigravity: [Model::ANTIGRAVITY_EVENTS order]}, hermes: {tool_events: [events], blocking_events: [events]}, antigravity: {tool_events: [Model::ANTIGRAVITY_TOOL_EVENTS], member_spec: ordonnateur}, sequenceable: [events], not_sequenceable: {event: reason}, guard_events: [events], effects_text, hook_edit: bool, provenance: {enabled: bool, store: local|extension, degraded: bool}, desktop: {open: bool, reason: null|string}}"
    hook_edit_note: "hook_edit is web.hook_edit with its kill switch applied, read at each request. desktop.open is true when the server has a display and an opener on PATH, else false with the reason."
    not_sequenceable: "Every Claude Code event outside the sequenceable list, with Model.refused_reason."
    lifecycle_order:
      claude-code: [Setup, SessionStart, InstructionsLoaded, UserPromptSubmit, UserPromptExpansion, PreToolUse, PermissionRequest, PermissionDenied, PostToolUse, PostToolUseFailure, PostToolBatch, SubagentStart, SubagentStop, TaskCreated, TaskCompleted, TeammateIdle, Notification, MessageDisplay, Elicitation, ElicitationResult, PreCompact, PostCompact, PreModelSwitch, PostModelSwitch, ConfigChange, CwdChanged, DirectoryAdded, FileChanged, WorktreeCreate, WorktreeRemove, Stop, StopFailure, SessionEnd]
      codex: [SessionStart, UserPromptSubmit, PreToolUse, PermissionRequest, PostToolUse, SubagentStart, SubagentStop, PreCompact, PostCompact, Interrupt, Stop, SessionEnd]
    effects_text: "Running Claude Code sessions pick up the change through their settings file watcher; new sessions read it at start."
  "GET /api/v1/projects":
    answers: "{projects: [{root, name, sources: [discovered|setting|pinned], local_hooks: int, local_card: bool}], notes: [string]}"
    discovery: "When web.discover is true: read ${CLAUDE_CONFIG_DIR}/.claude.json when CLAUDE_CONFIG_DIR is set, else ~/.claude.json; skip it with a note when it is missing, unreadable, not JSON or above 64 MiB; keep the keys of its projects object that are existing directories with a <root>/.claude/settings.local.json holding a hooks object, or with a local card; at most 500."
    union: "Discovered, web.projects and the pinned list, deduplicated by realpath, sorted by name then root. A setting or pinned root that is not a directory is listed with a note, never dropped silently."
  "GET /api/v1/folders":
    query: "path=<absolute directory> optional, the user's home when absent; hidden=1 lists dot folders too"
    answers: "{path, parent: null|absolute path, entries: [{name, path}], total, truncated}. path is the realpath, entries are folders only sorted case-insensitively, at most 1000."
    errors: "422 refused for a relative path, a missing or non-directory path or one the server cannot read. Answered by the folder_picker port: a plugin-local extension first (extensions/rui-hub, which only ever declines list), then lib/ordonnateur/folder_picker/standalone.rb."
    read_only: "A read: allowed on a --read-only server."
  "PUT /api/v1/state/projects":
    body: "{pinned: [absolute directory paths]}, at most 200"
    effect: "Writes <state>/web/projects.json (mode 0600, atomic). ordonnateur's own state, so no plan. 422 invalid for a relative path, a non-directory or too many entries."
  "GET /api/v1/fingerprint":
    query: "project=<root> optional"
    answers: "{config, timings}: config is the watch fingerprint of every hook source and card for that project; timings is a sha256 over the timing rows."
  "GET /api/v1/layout":
    query: "project=<root> optional; without it only user, managed, plugin and Codex sources are read, by loading the inventory with <state>/web/empty-root (an empty directory) as the project root, never the server's working directory"
    answers: >
      {fingerprint: {config, timings}, project, settings_files: {user: path, local: path|null, codex: path, hermes: path, antigravity: {global: path, workspace: [workspace hooks.json paths found for the project, nearest first; empty without a project]}},
      hooks: [hook], cards: {user: {path, card}|null,
      local: {path, card}|null}, findings: [finding], notes: [string]}
    hook: "Every field of `ordonnateur list --json` for the hook (Inventory.load_full), plus effective_timeout (Hook#effective_timeout: the hook's timeout, else the event default in seconds), guard (bool, Inventory.guard? with the scope's unguarded list), hard_guard (bool), findings: [finding id], timing: {runs, p50, p95, max, failures, slow, near_timeout}|null. A card member's position is in its status, member#<N>, 1-based; list --json carries no separate position field. A hook's `reason` is a predicate that follows the hook's name (\"is a guard on PreToolUse; ...\", \"is on PermissionRequest, which cannot be sequenced: ...\"); a client shows it as `<program> <reason>`."
    hermes_hook: "A hook with harness hermes has scope user, plugin null, group_index the entry's index in the event list, handler_index 0 and status allowlisted|auto-accepted|not-allowlisted; trust is {state, approved_at, script_mtime_at_approval, opt_in}. guard and hard_guard are both true exactly when the hook is pinned (fail_closed on a blocking event, or protected by the policy engine), else false. settings_files.hermes is $HERMES_HOME/config.yaml."
    antigravity_hook: "A hook with harness antigravity has scope global, workspace or plugin (plugin set to the plugin directory name for plugin hooks), hook_name the hook spec's key, group_index the group index on a tool event or the handler index on a flat event, handler_index the index inside the group (0 on a flat event), member true when the hook sits in the spec named ordonnateur and its file has a ledger, and status active|member|disabled|disabled-plugin|file-skipped|ignored-event|prompt (member#<N> is not used; the member position is the hook's order inside the spec). guard and hard_guard are both true exactly when the hook is pinned (protected by the policy engine), else false. Claude Code, Codex and Hermes hooks carry neither hook_name nor member."
    finding: "Every field of `ordonnateur lint --json` for the finding, plus id: first 12 hex of sha256 over code, hook id and message."
    etag: "ETag is the sha256 of config + timings; If-None-Match answers 304."
  "POST /api/v1/plans":
    body: "{scope: user|local|global|workspace, project: <root>|null, base: <config fingerprint>, changes: [change]}"
    change_kinds:
      order: "{op: order, event, hooks: [hook ids in run order], stop_on_block?: bool}. The final member list of a carded or newly carded event; a reorder is an order with the same ids."
      release: "{op: release, event}"
      guard: "{op: guard, hook}"
      unguard: "{op: unguard, hook}"
      delete: "{op: delete, hook}. Removes one hook from its harness file: a Claude Code handler from the scope's settings (and from the card when it is a member, releasing the event when it was the last), a Hermes entry from config.yaml, an Antigravity handler from hooks.json (and the ledger when it is a member). Needs web.hook_edit, else 403 edit_disabled. A draft holds exactly one delete and no other change (anything else answers 422 invalid). Codex, plugin, pinned and dispatcher hooks answer 422 refused. Classification delete, hold_required true."
    hermes_changes: "A Hermes plan holds only order changes: {op: order, event, hooks: [Hermes hook ids in the new order of the named unpinned hooks]}, every id on that one event and one harness, event one of Model::HERMES_EVENTS, no stop_on_block. scope must be user (else 422 invalid). A draft mixing Hermes and Claude Code changes, or an order mixing their hooks, answers 422 invalid. release, guard and unguard naming a Hermes hook (or release naming a Hermes event) answer 422 refused with refusals [`<id>: Hermes has no cards`]. A pinned hook, a hook of another event, a duplicate, fewer than two hooks, an unsupported config.yaml layout or a Python-only event answer 422 refused through HermesOrder. Several order changes of different events are planned in turn, each over the text the previous one produced, into one plan with one write of config.yaml."
    antigravity_changes: "Scope global or workspace makes an Antigravity plan (any other value than user, local, global or workspace answers 422 invalid; workspace needs project). It holds only {op: order, event, hooks: [Antigravity hook ids in the new order]} and {op: release, event}, event one of Model::ANTIGRAVITY_EVENTS, no stop_on_block. Every id of an order sits on that event, in one writable file, and its scope equals the request scope (a mismatch, an id of another harness, or ids of two files answer 422 invalid); a plugin id answers 422 refused with refusals [`<id>: plugin hooks are read-only`]; a Codex id answers 422 refused as before. guard and unguard naming an Antigravity hook answer 422 refused with refusals [`<id>: Antigravity has no cards`], in any scope. An Antigravity id in a user or local draft, or any other harness in a global or workspace draft, answers 422 invalid. For a workspace plan the file is the source_file of the draft's order hooks and is passed to AntigravityOrder as file; a release-only workspace draft leaves AntigravityOrder to find the one workspace file holding members (several files answer 422 refused). Several changes of different events are planned in turn, each over the hooks.json text and ledger text the previous one produced (Overlay), into one plan with one write of hooks.json and one of the ledger. Disabled, file-skipped, prompt, ignored-event, pinned and disabled-plugin hooks, fewer than two hooks, a hand-made ordonnateur spec without a ledger and every other engine refusal answer 422 refused through AntigravityOrder."
    antigravity_plan: "An Antigravity plan lists hooks.json in files and, when the ledger changes (member mode or release), the ledger file (<state>/ordonnateur/antigravity/<scope>-<hash>.json); card_before and card_after are null; effects_text is `Antigravity reads hooks when a session starts; running sessions may keep the order they loaded.`; orders carries, per event whose order changed, the ids before and after (member mode: after is the members of the ordonnateur spec in order). Its plan_id hashes the same fields with card_path the ledger path. Apply rebuilds through AntigravityOrder#apply: policy verdict check for both files, backups, sha recheck, atomic writes (hooks.json then ledger), one ordonnateur.card.applied event with harness antigravity. Plugin files, config.json, plugin.json and plugins.json are never written."
    validation: "local scope needs project. At most one order or release per event. A guard or unguard naming a hook on an event that also has an order or release in the same draft answers 422 conflict_in_draft. A Codex hook id answers 422 refused (Codex is read-only). An unknown op, event or hook answers 422 invalid."
    base: "When base is not the current config fingerprint for the project, 409 base_moved with the current fingerprint; nothing is planned."
    build: "One Takeover for the scope, cwd = project root (local) or HOME (user). Apply guard and unguard first, then each order (plan_order) and release (plan_release), in the order given. A Takeover Refused answers 422 refused with the refusal lines; SettingsChanged answers 409 base_moved."
    answers: >
      201 {plan_id, scope, project, classification, needs_confirm, applicable, blocked_reason,
      files: [{path, sha_before, diff, changes: bool}], verdicts: [{path, verdict, rule_id, reason}],
      card_before, card_after, lint: {before: [finding], after: [finding], added: [finding id], resolved: [finding id]},
      effects_text, notes, created_at, orders: [{event, before: [hook id], after: [hook id]}]}
    orders: "One entry per event whose order the plan changes, with the Hermes hook ids of the whole event list before and after; an empty list for a Claude Code plan."
    hermes_plan: "A Hermes plan lists one file (config.yaml) in files, has card_before and card_after null, classification reorder (needs_confirm false), effects_text the restart note `Hermes applies this order to new processes; a running gateway keeps its current order until restart.` and the HermesOrder notes. Its plan_id hashes the same fields with a null card_path and card_text_after. Apply rebuilds through HermesOrder#apply: policy verdict check, backup of config.yaml, sha recheck, atomic write, one ordonnateur.card.applied event with harness hermes. The Hermes allowlist is never written."
    plan_id: "pl_ + first 16 hex of sha256 over the canonical JSON of {scope, settings_path, settings_sha, settings_text_after, card_path, sha256(card_text_before), card_text_after, verdicts}."
    classification: "A delete plan is classification delete with needs_confirm false and hold_required true, whatever the harness. A script_edit plan is classification script_edit, hold_required true. A Hermes plan is always reorder. An Antigravity plan is reorder (needs_confirm false) when every change is in-place mode or a member-mode reorder whose set of ordonnateur-spec members is unchanged, and change (needs_confirm true, the plan id typed) when any hook enters or leaves the ordonnateur spec (member mode with a different member set, or release). For Claude Code, reorder when a card existed before, every event in before or after has the same member id set and the same stop_on_block on both sides, unguarded is equal, and the settings text is unchanged; change otherwise. needs_confirm is true for change."
    applicable: "false when nothing changes (blocked_reason nothing_to_apply) or any verdict is warn (policy_warn) or deny (policy_deny)."
    lint_after: "Lint runs over the inventory loaded with the plan's settings and card texts laid over the files they replace (Overlay), so the after set is what `ordonnateur lint` would print once applied; timing rows are the current ones."
    retention: "Plans live in server memory, at most 200 and 1 hour each; the oldest go first."
  "GET /api/v1/plans/{id}": { answers: "the plan, or 404 not_found" }
  "POST /api/v1/plans/{id}/apply":
    body: "{confirm?: <plan id>, hold_id?: <hold id>}"
    hold: "A plan with hold_required true applies only with a hold_id from POST /api/v1/plans/{id}/hold made by this session for this plan, used within its window and not before not_before; else 422 hold_required, hold_early, hold_expired or hold_unknown. The typed confirm is not asked for a hold plan. The hold is consumed by the attempt, whatever it answers."
    steps:
      - "404 not_found for an unknown or expired plan; 409 already_applied for an applied one."
      - "403 disabled when web.enabled resolves false; 405 read_only under --read-only."
      - "Rebuild the plan from its stored request. A different plan_id answers 409 plan_changed with the new plan id."
      - "needs_confirm without confirm equal to the plan id answers 422 confirm_required with the plan id."
      - "applicable false answers 422 with its blocked_reason; a warn or deny is never applied from the web."
      - "Takeover#apply: backup, settings sha recheck (SettingsChanged answers 409 plan_changed), atomic writes keeping each file's mode, ordonnateur.card.applied events with via web."
    answers: "200 {plan_id, applied: true, files: [written paths], backups: [backup paths], fingerprint: {config, timings}}"
  "GET /api/v1/hooks/{id}":
    query: "project=<root> optional"
    answers: >
      {hook: the layout hook, script: {path, resolved_from: command|args|null, kind: text|binary|missing|too_large|unreadable|refused,
      size, mtime, sha256, line_count, shebang, executable, content: string|null (text up to 256 KiB), refusal: null|reason},
      command_words: [string], provenance: {store: local|extension, degraded: bool, summary: {count, first_at, first_kind, last_at, last_kind} (times ISO-8601 UTC, null when count is 0; the page words and localizes it), events: [event, newest first, at most 200]},
      capabilities: {download: bool, open_file: bool, open_folder: bool, edit_mode: bool, edit_script: {allowed: bool, refusal: null|reason},
      delete_hook: {allowed: bool, refusal: null|reason}}, ai: {cli: {show, edit, delete}, skill: ordonnateur, prompt: string}}
    script_resolution: "The first word of the command, or the first word that is not a flag after an interpreter (ruby, python, python3, node, bash, sh, zsh, env), with ~, $HOME, ${CLAUDE_PROJECT_DIR} and ${CLAUDE_PLUGIN_ROOT} expanded and the result resolved to a real path. A file that is missing, not regular, above 1 MiB or under a credential directory (~/.ssh, ~/.gnupg, ~/.aws, ~/.config/gcloud, ~/.config/rstack/secrets, ~/.rstack/secrets) or named .env* is never served, and kind says which. A command that runs its program through `bash -c` or `sh -c` names no script, so script.kind is missing and resolved_from is null. A file between 256 KiB and 1 MiB is too_large with its sha and line count but no content."
    refusal_reasons: "Codex hooks, plugin hooks, policy-pinned hooks (hard_guard), hooks of a scope the app cannot write, a script a pinned hook also runs, a script not owned by the user or not writable, and the dispatcher hook are never editable or deletable; the answer names the reason."
    read_only: "A read: allowed on a --read-only server."
  "GET /api/v1/hooks/{id}/script":
    answers: "The script file's bytes, application/octet-stream, Content-Disposition attachment with the base name, X-Content-Type-Options nosniff. 404 not_found when no servable script, 422 refused for a refused path. The page fetches it with the bearer token and saves the blob."
    read_only: "A read: allowed on a --read-only server."
  "POST /api/v1/hooks/{id}/open":
    body: "{target: file|folder}"
    effect: "Asks the desktop of the machine that runs the server to open the script (file) or its folder (folder) with xdg-open or open. Needs a display (DISPLAY, WAYLAND_DISPLAY or macOS) and the opener on PATH, else 422 no_desktop. target file is allowed only for a text-like type (text/*, shell, ruby, python, perl, javascript, json); any other type answers 422 refused and the page offers the folder. Nothing is written. It counts as a change for the limiter and is refused under --read-only."
  "GET /api/v1/provenance":
    query: "project=<root> optional; hook=<id> optional; limit=<n> optional, default 200, at most 1000"
    answers: "{store: local|extension, degraded: bool, note, events: [{id, at, kind, hook_id, harness, scope, plugin, event, source_file, basis: observed|ordonnateur|plugin_record|file_mtime, via: cli|web|watch|tick|null, detail}]}"
    kinds: "first_seen, changed, disappeared, reappeared, enabled, disabled, edited, deleted"
    read_only: "A read: allowed on a --read-only server."
  "POST /api/v1/hooks/{id}/script/plan":
    body: "{project: <root>|null, base_sha: <script sha256>, content: <full new text, UTF-8, no NUL, at most 256 KiB>}"
    effect: "Builds a script_edit plan: files [{path, sha_before, diff, changes}], verdicts from the policy port judging a Write of that path, classification script_edit, hold_required true, applicable false with blocked_reason nothing_to_apply when the text is unchanged, policy_warn or policy_deny on a verdict. 403 edit_disabled while web.hook_edit is false. 409 base_moved when the file's sha is not base_sha. 422 refused with the refusal reason."
  "POST /api/v1/plans/{id}/hold":
    body: "{}"
    effect: "Starts a hold for a plan whose hold_required is true. Answers 201 {hold_id, not_before, expires_at}: not_before is three seconds after the server's own clock read, expires_at sixty seconds after. A hold belongs to one session and one plan, is used once, and a second hold for the same plan replaces the first."
  "GET /api/v1/health":
    query: "project=<root> optional; harness=all|claude-code|codex|hermes|antigravity optional, default all"
    answers: "{dimensions, findings, unmapped_codes, heal_mode: off|plan|auto, heal_locked_by: null|env name}. The same redacted facts as `untangle --json`, with no model, no heal, and no write. Opening a page never heals, whatever untangle.heal says."
    read_only: "A read: allowed on a --read-only server."
  "POST /api/v1/runs":
    body: "{verb: untangle|plan, project: <root>|null, model: bool, harness?, heal?: none|preview|apply, answers?: {goal, harnesses, unattended, constraint}, interview?: saved|skip, scope?: user|local}"
    untangle: "Runs Untangle with the same options as the command line: model false is --no-model, heal preview lists every plan and writes nothing, even under auto, and heal apply is --heal --apply. heal none with untangle.heal auto is a plain untangle, so it applies the safe healers, as the contract says, and the page says so before the person runs it."
    plan: "Runs SetupPlan. answers saves them as the profile, like --answers. interview skip is --no-interview, and interview saved uses the saved profile. No answers, no saved profile, and no skip answers 422 answers_needed. scope is --scope, default user; local needs project. model false is --no-model."
    answers: "202 {run_id, verb, status: running, started_at}. 409 run_active with run_id while any run is active. 403 disabled when web.enabled resolves false. 422 invalid for an unknown verb, option, or harness, or for a heal the setting forbids."
    execution: "One background thread per run, one active run in the process. A run holds the apply lock only while it writes. Model limits stay those of the advisor, so a run ends on its own."
  "GET /api/v1/runs":
    answers: "{active: <run>|null, latest: {untangle: <run id>|null, plan: <run id>|null}}, so a reloaded page finds its run again."
  "GET /api/v1/runs/{id}":
    answers: "{run_id, verb, status: running|done|failed, started_at, finished_at, exit, report, error}. report is the parsed --json output of the verb, already redacted. error is a plain message, and a failure that is not an ordonnateur error is logged and answers `internal error`. 404 not_found for an unknown or expired run."
    retention: "Runs live in server memory, the newest 20 and 1 hour each. An active run is never dropped."
  "GET /api/v1/proposals":
    query: "project=<root> optional"
    answers: "{questions, profile: {answers, at}|null, proposals: [proposal of the newest batch for this project], applied: {proposal id: at}}"
  "POST /api/v1/proposals":
    body: "{proposals: [proposal], project: <root>|null, scope?: user|local}"
    effect: "--proposals for a person who pasted what an agent wrote: validates and stores under the same rules. 201 {stored, refused}."
  "POST /api/v1/proposals/apply":
    body: "{ids: [proposal id], project: <root>|null, allow_widening?: bool, confirm?: <proposal id>}"
    rules: "Each id applies through SetupPlan's apply path, with its diff, policy judgment, backup, and compare-and-swap. allow_widening needs exactly one id and confirm equal to it, else 422 confirm_required. 403 disabled when web.enabled resolves false. A warn or deny refuses that proposal."
    answers: "200 {applied: [{id, status, code, reason, diff, backups}]}"
  "GET /api/v1/settings":
    answers: "{settings: [{key, type, options, value, default, layer, description, locked_by: null|env name}], extension_available: bool}. Only untangle.heal, advisor.backend, advisor.harness, and advisor.model."
  "PUT /api/v1/settings/{key}":
    body: "{value, confirm?}"
    rules: "Only the four keys above; any other key answers 404 not_found, so web.* and run.* can't change from a browser. untangle.heal auto needs confirm equal to auto, else 422 confirm_required. advisor.model must match ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$, else 422 invalid. A key whose kill switch is set answers 422 locked. The policy port judges a write of the settings file first, and a warn or deny answers 422 policy_warn or policy_deny. 403 disabled when web.enabled resolves false."
    answers: "200 {key, value, layer, from}"
  "DELETE /api/v1/settings/{key}":
    rules: "Resets a key to its default, under the same key, lock, policy, and disabled rules. Resetting needs no confirm, because no default turns on healing."
  static: "GET / serves web/public/index.html; other paths serve web/public files."

browser:
  sections: "Tabs for Hooks, Health, Plan, and Settings replace the page title. Hooks keeps Map and List, the sources bar, drafts, and plans as they are. The choice is kept under the pref `section`, and `?section=hooks|health|plan|settings` starts on one without writing the pref. Keys 1 to 4 switch sections. The project combobox applies to Hooks, Health, and Plan; the harness control applies to Hooks and Health."
  health: "A strip of eight dimensions, each a button with its status in words and its finding count, filters the findings table. A model assessment appears only after a run and is labeled as judged by a model. A heal is previewed in a drawer with its diff and applied only by the person pressing Apply; when the heals include one that isn't safe, Apply also needs the word heal typed."
  plan: "A rail holds the four goal questions, all optional, and the run options: scope, and model or facts only. Run plan is always available; fields left empty mean skip, and emptying saved answers replaces them rather than reusing them. Each answered field has a visible Clear. Proposals list beside it with what each serves, its diff or instructions, and Apply for an apply proposal. A proposal that widens access is labeled, and needs its id typed. Facts only shows the prompt to copy for an agent, and a field takes the proposals that agent wrote."
  settings: "Four rows: untangle.heal, advisor.backend, advisor.harness, and advisor.model, each with its current source and a reset. Choosing auto needs the word auto typed. A kill switch locks its row, shows the source chip Locked, and names the switch in the row's hint."
  runs: "A run shows its elapsed time and survives a reload. Running and heal-applying controls are disabled with the reason on a read-only server."
  project_selector: "The project combobox lists Global Shelf (no project, the default and the input text when none is chosen or registered) pinned first with an accent rail and tint, Select a Folder... in the warn colour under it, a separator, then the projects. Typing filters only the projects. Select a Folder... opens the in-app folder picker (selectable=folder, the rui-hub composite.form.file-picker props), which reads GET /api/v1/folders; confirming pins the folder through PUT /api/v1/state/projects, selects it and loads its hooks. The folder_picker port is declared in the manifest; its local rui-hub extension reports source rui-hub only when rui-hub serves the built component script, which today it does not, so source is standalone."
  sources: "A provider is one source row of one harness (claude-code:user, codex:user, hermes:user, claude-code:plugin:<id>, and so on). The toolbar shows one colored toggle per provider when two or more are visible; each provider keeps a fixed color per theme. Switching one off hides its hooks in the matrix and the list; drafts, plans and order numbers keep reading the full layout. The off set is kept in the browser under the pref `sources`; everything is on by default and a provider seen for the first time appears on. Show all is offered while any provider is off and Hide all while any provider is on; Hide all switches every provider off and announces it. Hovering or focusing a toggle highlights that provider's cards and row header in the matrix and its rows in the list (data-hot). A provider that is off hides every one of its rows in the list too, card members and natives of an edited scope included. A matrix row name is never truncated: it wraps, breaking first after @ and ·; the path under it may clip. Matrix columns size to their widest hook card, with a minimum of --col-w (--col-w-compact in compact density), and a card never truncates or wraps its text."
  sort: "Every list column but Actions is a sort button. A sort reorders rows inside each event group and never moves the groups or changes the matrix. The default is # ascending, execution order; # restores it from any other sort. Clicking the active column flips its direction; another column starts ascending for #, Hook, Source and Status and descending for Findings (severity, then count), p95 and Timeout. Missing values sort last in both directions and ties keep execution order. Order badges always show execution positions. The active th carries aria-sort, the change is announced, and the choice is kept in the browser under the pref `sort` as {key, dir}."
  hook_modal: "Activating a hook's command, its Details button in the inspector, a list row's command cell, or Details in the hook menu opens one modal with four tabs: Overview, Script, Provenance, Edit. Script shows the file read-only with line numbers, its path, size, modified time and sha, a Download button that saves the bytes, and Open in desktop with Open folder. Open in desktop is absent when the server has no desktop and says why. A script that is missing, binary, too large or refused shows that state and no content. Provenance lists each event with its time, kind, and how it is known, and says a first sighting is first seen, not installed. Edit is the only gated tab."
  hook_edit_gate: "The Edit tab is a stack of gates. While web.hook_edit is false it shows only the AI hand-off and how the person turns editing on in a terminal. With it on, it opens with the AI hand-off first: the ordonnateur hook commands, the skill name, and a prompt to copy, with the reason a model is the better editor. Only a button, I will edit it by hand, reveals the editor. Save builds the plan and shows its diff and policy verdict. Save script and Delete this hook are hold buttons: pressing and holding for three seconds fills a ring and commits; releasing early, losing focus, or pressing Escape cancels and nothing is sent. Keyboard: holding Space or Enter does the same. The server times the hold, so an early apply is refused. Delete this hook is a separate plan from the diff, and a delete that removes a card member says so."
  page_parameter: "`?off=<provider>,<provider>` or `?off=*` starts the page with those providers off; `?sort=<key>:<asc|desc>` starts the list with that sort; `?view=list|map` starts in that view; `?hook=<id>&tab=overview|script|provenance|edit` opens that hook's modal on that tab once the layout has loaded, and an unknown hook shows a toast. Each is for a shareable view and never writes a stored pref."

events:
  - { name: ordonnateur.web, fields: "event start|stop, bind, port, read_only", when: "server start and stop" }
  - { name: ordonnateur.card.applied, fields: "existing fields plus via: cli|web", when: "every applied event change" }
  - { name: ordonnateur.hook.edited, fields: "harness, scope, hook_id, path, sha_before, sha_after, plan_id, via: cli|web", when: "a script edit is applied" }
  - { name: ordonnateur.hook.deleted, fields: "harness, scope, hook_id, event, plan_id, via: cli|web", when: "a hook delete is applied" }
  - { name: ordonnateur.provenance.degraded, fields: "backend, reason", when: "the provenance store stops answering, once per outage" }
  - { name: "ordonnateur.heal.applied, ordonnateur.heal.skipped, ordonnateur.heal.rolled_back, ordonnateur.plan.applied", fields: "as in specs/untangle-plan.yml", when: "a run or apply from the browser, through the same code as the command line" }

agents: "The web app is for the person at the browser. An agent never drives its API, and that holds for runs, heals, proposals, and settings too; when it wants the person to change hook order it gives them the `ordonnateur order` plan or points them to `ordonnateur web`, and when it wants a hook's script edited or a hook deleted it uses `ordonnateur hook edit` or `ordonnateur hook delete`, which print the plan and write only with `--apply --confirm <plan id>` from the person's own go-ahead. Every write the app makes is still judged by the policy port first."
